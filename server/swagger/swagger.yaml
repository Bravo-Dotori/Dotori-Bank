openapi: 3.0.0

info:
  title: Dotori Bank API
  version: 1.0.0
  description: 회원가입 API 문서

servers:
  - url: http://localhost:3000

paths:
  /api/user/signup:

    post:
      summary: 회원가입

      tags:
        - User

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              properties:

                email:
                  type: string
                  example: test@test.com

                user_id:
                  type: string
                  example: testuser

                password_hash:
                  type: string
                  example: 1234

                role:
                  type: string
                  example: user

                birth_date:
                  type: string
                  example: 2000-01-01

              required:
                - email
                - user_id
                - password_hash
                - role
                - birth_date

      responses:

        '201':
          description: 회원가입 성공

          content:
            application/json:

              schema:
                type: object

                properties:

                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: 회원가입 성공

        '400':
          description: 필수값 누락

        '409':
          description: 중복 회원

        '500':
          description: 서버 오류