openapi: 3.0.0
info:
  title: Dotori API
  version: 1.0.0
  description: 도토리 금융 서비스 API 문서
servers:
  - url: "http://localhost:5000"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
security:
  - cookieAuth: []
paths:
  /api/accounts:
    get:
      summary: 내 계좌 목록 조회
      description: 로그인한 사용자의 전체 계좌 목록을 조회합니다.
      tags:
        - Accounts
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 계좌 조회 성공
          content:
            application/json:
              example:
                success: true
                message: 계좌 조회 성공
                data:
                  - id: 2
                    user_id: 2
                    account_number: "100-1111-111111"
                    account_type: demand
                    balance: 3000000
                    transfer_limit: 3000000
                    is_active: true
                    created_at: "2026-05-14T11:20:30.000Z"
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "404":
          description: 계좌 정보 없음
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_NOT_FOUND
                message: 계좌 정보 없음
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_SERVER_ERROR
                message: 계좌 조회 서버 에러
    post:
      summary: 입출금 계좌 생성
      description: 로그인한 사용자에게 기본 입출금 계좌를 생성합니다.
      tags:
        - Accounts
      security:
        - cookieAuth: []
      responses:
        "201":
          description: 입출금 계좌 생성 성공
          content:
            application/json:
              example:
                success: true
                data:
                  account_id: 13
                  account_number: "100-1234-567890"
        "400":
          description: 계좌 생성 실패
          content:
            application/json:
              example:
                success: false
                message: 계좌 생성 실패
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_SERVER_ERROR
                message: 계좌 생성 서버 에러
  /api/accounts/toAccount:
    post:
      summary: 받는 계좌 조회
      description: 계좌번호로 받는 계좌 정보를 조회합니다.
      tags:
        - Accounts
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_number
              properties:
                account_number:
                  type: string
                  example: "100-1111-111111"
      responses:
        "200":
          description: 받는 계좌 조회 성공
          content:
            application/json:
              example:
                success: true
                message: 계좌 조회 성공
                data:
                  - id: 2
                    user_id: 2
                    account_number: "100-1111-111111"
                    account_type: demand
                    balance: 3000000
                    name: 김이슬
        "400":
          description: 필수값 누락
          content:
            application/json:
              example:
                success: false
                message: 필수값 누락
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "404":
          description: 계좌 정보 없음
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_NOT_FOUND
                message: 계좌 정보 없음
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_SERVER_ERROR
                message: 계좌 조회 서버 에러
  "/api/accounts/{account_id}":
    get:
      summary: 계좌 상세 조회
      description: 로그인한 사용자의 특정 계좌 상세 정보를 조회합니다.
      tags:
        - Accounts
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: account_id
          required: true
          description: 조회할 계좌 id
          schema:
            type: integer
          example: 2
      responses:
        "200":
          description: 계좌 상세 조회 성공
          content:
            application/json:
              example:
                success: true
                message: 계좌 조회 성공
                data:
                  id: 2
                  user_id: 2
                  account_number: "100-1111-111111"
                  account_type: demand
                  balance: 3000000
                  is_active: true
                  created_at: "2026-05-14T11:20:30.000Z"
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "404":
          description: 계좌 정보 없음
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_NOT_FOUND
                message: 계좌 정보 없음
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                errorCode: ACCOUNT_SERVER_ERROR
                message: 계좌 조회 서버 에러
  /api/admin/transactions:
    get:
      summary: 관리자 거래 내역 조회
      description: |
          관리자가 전체 거래 내역을 조회합니다.
          
          프론트 처리
          - from_account_number: 출금 계좌번호
          - to_account_number: 입금 계좌번호
          - is_suspicious가 true이면 의심 거래 상태 뱃지를 표시합니다.
          - total_count는 조회된 전체 거래 건수입니다.
          
      tags:
        - Admin
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 관리자 거래 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 관리자 거래 내역 조회 성공
                  data:
                    type: object
                    properties:
                      total_count:
                        type: integer
                        example: 9
                      transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            transaction_at:
                              type: string
                              format: "date-time"
                              example: "2026-05-16T14:48:02.000Z"
                            from_account_id:
                              type: integer
                              example: 1
                            to_account_id:
                              type: integer
                              example: 2
                            type:
                              type: string
                              example: TRANSFER
                            amount:
                              type: integer
                              example: 3000000
                            is_suspicious:
                              type: boolean
                              example: false
                            description:
                              type: string
                              example: 초기 입출금 계좌 지급
                            from_account_number:
                              type: string
                              example: "100-0000-000000"
                            to_account_number:
                              type: string
                              example: "100-1111-111111"
        "400":
          description: 관리자 거래 내역 조회 실패
          content:
            application/json:
              example:
                success: false
                message: 관리자 거래 내역 조회 실패
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              example:
                success: false
                message: 관리자만 가능
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 관리자 거래 내역 조회 서버 에러
  /api/admin/accounts:
    get:
      summary: 관리자 고객 계좌 내역 조회
      description: |
          관리자가 전체 고객 계좌 내역을 조회합니다.
          
          프론트 처리
          - accounts 배열을 테이블에 표시합니다.
          - is_active가 true이면 토글 ON, false이면 토글 OFF로 표시합니다.
          - is_admin이 true이면 관리자 계좌로 표시할 수 있습니다.
          - total_count는 조회된 전체 계좌 건수입니다.
          
      tags:
        - Admin
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 관리자 고객 계좌 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 관리자 고객내역 조회 성공
                  data:
                    type: object
                    properties:
                      total_count:
                        type: integer
                        example: 12
                      accounts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            created_at:
                              type: string
                              format: "date-time"
                              example: "2026-05-16T14:48:02.000Z"
                            account_number:
                              type: string
                              example: "100-0000-000000"
                            account_type:
                              type: string
                              example: demand
                            balance:
                              type: integer
                              example: 100000000
                            is_active:
                              type: boolean
                              example: true
                            is_admin:
                              type: boolean
                              example: true
                            user_id:
                              type: integer
                              example: 1
                            user_name:
                              type: string
                              example: 관리자
                            user_role:
                              type: string
                              example: admin
        "400":
          description: 관리자 고객 계좌 내역 조회 실패
          content:
            application/json:
              example:
                success: false
                message: 관리자 고객내역 조회 실패
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              example:
                success: false
                message: 관리자만 가능
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 관리자 고객내역 조회 서버 에러
  "/api/admin/accounts/{account_id}/active":
    patch:
      summary: 관리자 계좌 활성화 여부 변경
      description: |
          관리자가 계좌의 활성화 여부를 변경합니다.
          
          요청 필드명 정리
          - account_id: URL path에 들어가는 계좌 id입니다.
          - is_active: 변경할 활성화 여부입니다. true 또는 false를 보냅니다.
          
          프론트 처리
          - 토글을 켤 때는 is_active=true를 보냅니다.
          - 토글을 끌 때는 is_active=false를 보냅니다.
          - 성공 후 /api/admin/accounts를 다시 조회하거나, 해당 row의 is_active 값을 갱신합니다.
          
      tags:
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: account_id
          required: true
          description: 활성화 여부를 변경할 계좌 id
          schema:
            type: integer
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_active
              properties:
                is_active:
                  type: boolean
                  example: false
      responses:
        "200":
          description: 계좌 활성화 여부 변경 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 계좌 활성화 여부 변경 성공
        "400":
          description: 요청값 오류 또는 계좌 없음
          content:
            application/json:
              examples:
                invalidBoolean:
                  value:
                    success: false
                    message: is_active 값은 boolean이어야 합니다.
                notFound:
                  value:
                    success: false
                    message: 계좌를 찾을 수 없습니다.
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "403":
          description: 관리자 권한 없음
          content:
            application/json:
              example:
                success: false
                message: 관리자만 가능
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 계좌 활성화 여부 변경 서버 에러
  /api/deposits:
    post:
      summary: 예금 상품 가입
      tags:
        - Deposits
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - target_period_months
                - target_amount
              properties:
                product_id:
                  type: integer
                  example: 1
                target_period_months:
                  type: integer
                  example: 6
                target_amount:
                  type: integer
                  example: 100000
      responses:
        "201":
          description: 예금 가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 예금 가입 성공
                  data:
                    type: object
                    properties:
                      depositAccountId:
                        type: integer
                        example: 6
                      depositAccountNumber:
                        type: string
                        example: "100-7445-734254"
                      targetAmount:
                        type: integer
                        example: 100000
                      targetPeriodMonths:
                        type: integer
                        example: 6
                      interestRate:
                        type: number
                        example: 3.1
                      maturityDate:
                        type: string
                        format: date
                        example: "2026-11-15"
        "400":
          description: 요청값 오류 또는 가입 조건 불일치
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 필수값 누락
        "404":
          description: 상품 또는 계좌 정보 없음
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 해당 상품 없음
        "409":
          description: 잔액 부족 등 현재 상태와 충돌
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 입출금 계좌 잔액 부족
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 예금 가입 서버 에러
  "/api/products/myProducts/{productId}":
    get:
      summary: 내 상품 상세 조회
      description: 로그인한 사용자의 가입 상품 상세 정보를 조회합니다.
      tags:
        - Products
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          description: user_products 기준 가입 상품 id
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: 내 상품 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 내 상품 상세 조회 성공
                  product:
                    type: array
                    items:
                      type: object
                      properties:
                        subscription_id:
                          type: integer
                          example: 1
                        product_id:
                          type: integer
                          example: 11
                        product_name:
                          type: string
                          example: 도토리 입출금통장
                        product_type:
                          type: string
                          example: demand
                        account_id:
                          type: integer
                          example: 2
                        target_amount:
                          type: integer
                          example: 3000000
                        interest_rate:
                          type: number
                          example: 0.1
                        join_date:
                          type: string
                          format: date
                          example: "2026-05-18"
                        maturity_date:
                          type: string
                          nullable: true
                          example: null
                        status:
                          type: string
                          example: ACTIVE
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "404":
          description: 가입 상품 없음
          content:
            application/json:
              example:
                success: false
                message: 상품을 찾을 수 없습니다.
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 상품 상세 조회 서버 에러
  "/api/products/myProducts/{productId}/cancel":
    patch:
      summary: 내 상품 해지
      description: 로그인한 사용자의 가입 상품을 해지합니다.
      tags:
        - Products
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          description: user_products 기준 해지할 가입 상품 id
          schema:
            type: integer
          example: 1
      responses:
        "200":
          description: 상품 해지 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 상품 해지 성공
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "404":
          description: 해지할 상품 없음
          content:
            application/json:
              example:
                success: false
                message: 상품을 찾을 수 없습니다.
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 상품 해지 서버 에러
  "/api/products/{productId}":
    get:
      summary: 상품 상세 조회
      description: 상품 ID를 기준으로 상품 상세 정보와 기간별 금리 목록을 조회합니다.
      tags:
        - Products
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
          description: 상품 ID
          example: 5
      responses:
        "200":
          description: 상품 상세 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  product:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      product_name:
                        type: string
                        example: 도토리 목돈예금
                      product_code:
                        type: string
                        example: DOTORI_DEPOSIT_BIG
                      product_type:
                        type: string
                        example: deposit
                      min_period_months:
                        type: integer
                        nullable: true
                        example: 12
                      max_period_months:
                        type: integer
                        nullable: true
                        example: 24
                      min_amount:
                        type: integer
                        nullable: true
                        example: 5000000
                      max_amount:
                        type: integer
                        nullable: true
                        example: 200000000
                      interests:
                        type: array
                        items:
                          type: object
                          properties:
                            period_months:
