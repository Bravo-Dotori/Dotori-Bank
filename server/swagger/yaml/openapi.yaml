  /api/recommend/deposits:
    post:
      summary: 예금 상품 추천
      description: 설문 답변을 기반으로 예금 상품 TOP 3를 추천합니다.
      tags:
        - Recommend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - goalType
                - amountRange
                - periodMonths
                - incomeRange
                - preferenceType
              properties:
                goalType:
                  type: string
                  description: 저축 목표
                  enum:
                    - emergency
                    - travel
                    - lump_sum
                    - housing
                    - investment
                  example: lump_sum
                amountRange:
                  type: string
                  description: 예치 가능 금액 범위
                  enum:
                    - under_100
                    - 100_400
                    - 400_700
                    - 700_1000
                    - over_1000
                  example: 100_400
                periodMonths:
                  type: integer
                  description: 가입 기간
                  enum:
                    - 3
                    - 6
                    - 12
                    - 24
                  example: 12
                incomeRange:
                  type: string
                  description: 월 소득 범위
                  enum:
                    - under_100
                    - 100_200
                    - 200_300
                    - over_300
                  example: 100_200
                preferenceType:
                  type: string
                  description: 추천 성향
                  enum:
                    - stable
                    - balanced
                    - profit
                  example: balanced
            example:
              goalType: lump_sum
              amountRange: 100_400
              periodMonths: 12
              incomeRange: 100_200
              preferenceType: balanced
      responses:
        "200":
          description: 예금 상품 추천 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  recommendations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 7
                        product_name:
                          type: string
                          example: 도토리 안정예금
                        product_code:
                          type: string
                          example: DOTORI_DEPOSIT_STABLE
                        product_type:
                          type: string
                          example: deposit
                        min_period_months:
                          type: integer
                          nullable: true
                          example: 12
                        max_period_months:
                          type: integer
                          nullable: true
                          example: 24
                        min_amount:
                          type: integer
                          nullable: true
                          example: 500000
                        max_amount:
                          type: integer
                          nullable: true
                          example: 30000000
                        period_months:
                          type: integer
                          example: 12
                        interest_rate:
                          type: string
                          example: 3.900
                        early_termination_rate:
                          type: string
                          nullable: true
                          example: 1.950
                        score:
                          type: number
                          format: float
                          example: 71.6
              example:
                success: true
                recommendations:
                  - id: 7
                    product_name: 도토리 안정예금
                    product_code: DOTORI_DEPOSIT_STABLE
                    product_type: deposit
                    min_period_months: 12
                    max_period_months: 24
                    min_amount: 500000
                    max_amount: 30000000
                    period_months: 12
                    interest_rate: 3.900
                    early_termination_rate: 1.950
                    score: 71.6
        "400":
          description: 필수 설문 답변 누락 또는 잘못된 요청
          content:
            application/json:
              example:
                success: false
                message: 필수 설문 답변이 누락되었습니다.
        "500":
          description: 서버 오류
          content:
            application/json:
              example:
                success: false
                message: 상품 추천 중 오류가 발생했습니다.
  /api/transactions:
    get:
      summary: 거래 내역 조회
      description: |
          로그인한 사용자의 입출금 계좌 기준 거래 내역을 조회합니다.
          
          요청 필드명 정리
          - period: 기간 필터입니다. all, 1, 3, 6, 12 중 하나를 보냅니다.
          - type: 입출금 방향 필터입니다. all, in, out 중 하나를 보냅니다.
          
          값 의미
          - period=all: 전체 기간
          - period=1: 최근 1개월
          - period=3: 최근 3개월
          - period=6: 최근 6개월
          - period=12: 최근 12개월
          - type=all: 전체 거래
          - type=in: 입금 거래
          - type=out: 출금 거래
          
          프론트 처리
          - data.account_id와 transaction.to_account_id가 같으면 입금입니다.
          - data.account_id와 transaction.from_account_id가 같으면 출금입니다.
          - 입금 title은 from_user_name, 출금 title은 to_user_name을 사용하면 됩니다.
          - 금액 표시는 입금이면 +, 출금이면 -를 붙여 표시합니다.
          
      tags:
        - Transactions
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: period
          required: false
          description: "기간 필터. all, 1, 3, 6, 12 중 하나를 사용합니다."
          schema:
            type: string
            enum:
              - all
              - 1
              - 3
              - 6
              - 12
            default: all
          example: 3
        - in: query
          name: type
          required: false
          description: "입출금 방향 필터. all은 전체, in은 입금, out은 출금입니다."
          schema:
            type: string
            enum:
              - all
              - in
              - out
            default: all
          example: in
      responses:
        "200":
          description: 거래 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 거래 내역 조회 성공
                  data:
                    type: object
                    properties:
                      account_id:
                        type: integer
                        example: 1
                      total_count:
                        type: integer
                        example: 12
                      transactions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            transaction_at:
                              type: string
                              format: "date-time"
                              example: "2025-05-09T14:30:00.000Z"
                            from_account_id:
                              type: integer
                              example: 3
                            to_account_id:
                              type: integer
                              example: 1
                            type:
                              type: string
                              example: TRANSFER
                            amount:
                              type: integer
                              example: 3000000
                            balance_after:
                              type: integer
                              example: 3000000
                            description:
                              type: string
                              example: 가입 축하금
                            is_suspicious:
                              type: boolean
                              example: false
                            from_user_name:
                              type: string
                              example: 관리자
                            to_user_name:
                              type: string
                              example: 김이슬
        "400":
          description: 거래 내역 조회 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 입출금 계좌가 없습니다.
        "401":
          description: 인증 실패
          content:
            application/json:
              example:
                success: false
                errorCode: TOKEN_REQUIRED
                message: 로그인 필요
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 거래 내역 조회 서버 에러
  /api/transfer:
